services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: react-app
    container_name: react-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    stdin_open: true
    tty: true
    networks:
      - react-network

networks:
  react-network:
    driver: bridge
