services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: react-app
    container_name: react-app
    ports:
      - "3000:3000"
      - "3010:3010"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - react-network

networks:
  react-network:
    driver: bridge
